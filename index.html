<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            /* Previene lo scroll verticale su tutto il body */
            overflow: hidden;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px 0 rgba(31, 38, 135, 0.05);
        }
    </style>
</head>
<body class="h-screen w-screen p-2 md:p-4 text-slate-800 flex flex-col">
    <!-- Contenitore flessibile che occupa l'intera altezza senza scroll -->
    <div class="max-w-6xl w-full mx-auto flex flex-col h-full gap-3">
        
        <!-- Header compatto -->
        <header class="text-center shrink-0 pt-2">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-700 to-slate-900 tracking-tight">House Day</h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium">Classifica aggiornata al 14/10/2026</p>
        </header>

        <!-- Sezione Input: Su iPad disporrà 4 colonne in orizzontale (o 2x2 in verticale) occupando poco spazio -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 shrink-0" id="team-inputs">
            <!-- Gli input vengono generati da JS -->
        </div>

        <!-- Sezione Classifica: Occupa tutto lo spazio rimanente (flex-grow) -->
        <div class="glass-panel rounded-xl flex-grow flex flex-col overflow-hidden mb-2">
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-2 shrink-0">
                <h2 class="text-lg font-bold text-center tracking-wide">Classifica</h2>
            </div>
            <!-- Contenitore della tabella flessibile -->
            <div class="flex-grow flex flex-col justify-center p-2">
                <table class="w-full h-full text-left border-collapse">
                    <thead>
                        <tr class="text-[10px] md:text-xs uppercase tracking-widest text-slate-400 border-b border-slate-200">
                            <th class="pb-2 font-semibold text-center w-12">Pos</th>
                            <th class="pb-2 font-semibold">Squadra</th>
                            <th class="pb-2 font-semibold text-center">Membri</th>
                            <th class="pb-2 font-semibold text-center">Punti</th>
                            <th class="pb-2 font-semibold text-right pr-4">Efficienza</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-100">
                        <!-- La classifica viene generata da JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const teams = [
            { id: 'aquilablu', name: 'AquilaBlu', color: 'blue' },
            { id: 'cerogiallo', name: 'CeroGiallo', color: 'yellow' },
            { id: 'tassorosso', name: 'TassoRosso', color: 'red' },
            { id: 'querciaverde', name: 'QuerciaVerde', color: 'green' }
        ];

        const colors = {
            blue: { bg: 'bg-blue-50/70', border: 'border-blue-200', text: 'text-blue-900', badge: 'bg-blue-100 text-blue-800', inputFocus: 'focus:ring-blue-400' },
            yellow: { bg: 'bg-amber-50/70', border: 'border-amber-200', text: 'text-amber-900', badge: 'bg-amber-100 text-amber-800', inputFocus: 'focus:ring-amber-400' },
            red: { bg: 'bg-rose-50/70', border: 'border-rose-200', text: 'text-rose-900', badge: 'bg-rose-100 text-rose-800', inputFocus: 'focus:ring-rose-400' },
            green: { bg: 'bg-emerald-50/70', border: 'border-emerald-200', text: 'text-emerald-900', badge: 'bg-emerald-100 text-emerald-800', inputFocus: 'focus:ring-emerald-400' }
        };

        const inputsContainer = document.getElementById('team-inputs');
        const leaderboardBody = document.getElementById('leaderboard-body');

        teams.forEach(team => {
            const c = colors[team.color];
            const card = document.createElement('div');
            card.className = `glass-panel px-3 py-2 rounded-xl border ${c.border} ${c.bg} space-y-2 flex flex-col justify-center`;
            card.innerHTML = `
                <h3 class="text-base md:text-lg font-bold ${c.text} text-center tracking-tight m-0">${team.name}</h3>
                <div class="grid grid-cols-2 gap-2">
                    <div class="space-y-1">
                        <label class="block text-[9px] md:text-[10px] font-semibold uppercase tracking-wider text-slate-500 text-center">Membri</label>
                        <input type="number" min="1" id="members-${team.id}" class="w-full p-1.5 md:p-2 bg-white border border-slate-200 rounded-lg focus:ring-2 outline-none transition-shadow ${c.inputFocus} shadow-sm text-center text-sm font-medium text-slate-700" placeholder="0" oninput="calculate()">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-[9px] md:text-[10px] font-semibold uppercase tracking-wider text-slate-500 text-center">Punti</label>
                        <input type="number" min="0" step="0.5" id="points-${team.id}" class="w-full p-1.5 md:p-2 bg-white border border-slate-200 rounded-lg focus:ring-2 outline-none transition-shadow ${c.inputFocus} shadow-sm text-center text-sm font-medium text-slate-700" placeholder="0" oninput="calculate()">
                    </div>
                </div>
            `;
            inputsContainer.appendChild(card);
        });

        function calculate() {
            let results = [];
            teams.forEach(team => {
                const membersInput = document.getElementById(`members-${team.id}`).value;
                const pointsInput = document.getElementById(`points-${team.id}`).value;
                
                const members = parseInt(membersInput) || 0;
                const points = parseFloat(pointsInput) || 0;
                
                let efficiency = 0;
                let maxPoints = members * 2;

                if (members > 0) {
                    efficiency = (points / maxPoints) * 100;
                    if (efficiency > 100) efficiency = 100; 
                }

                results.push({
                    team: team,
                    members: members,
                    points: points,
                    maxPoints: maxPoints,
                    efficiency: efficiency,
                    hasData: membersInput !== '' && pointsInput !== '' 
                });
            });

            results.sort((a, b) => b.efficiency - a.efficiency || b.points - a.points);

            leaderboardBody.innerHTML = '';
            results.forEach((res, index) => {
                const c = colors[res.team.color];
                const tr = document.createElement('tr');
                
                // La riga occuperà uniformemente lo spazio verticale a disposizione in tabella
                tr.className = `transition-colors hover:bg-slate-50/80 h-[20%]`; 
                
                let posBadge = 'bg-slate-100 text-slate-400';
                let posTrophy = '';
                
                if (res.hasData) {
                    if (index === 0) {
                        posBadge = 'bg-gradient-to-br from-yellow-300 to-yellow-500 text-yellow-900 shadow ring-1 ring-yellow-200 ring-offset-1';
                        posTrophy = '🏆';
                    } else if (index === 1) {
                        posBadge = 'bg-gradient-to-br from-slate-200 to-slate-300 text-slate-700 shadow-sm';
                    } else if (index === 2) {
                        posBadge = 'bg-gradient-to-br from-orange-200 to-orange-300 text-orange-800 shadow-sm';
                    } else {
                        posBadge = 'bg-white border border-slate-200 text-slate-500';
                    }
                }

                tr.innerHTML = `
                    <td class="text-center">
                        <span class="inline-flex items-center justify-center w-7 h-7 md:w-8 md:h-8 rounded-full font-bold text-xs md:text-sm ${posBadge}">
                            ${res.hasData ? index + 1 : '-'}
                        </span>
                    </td>
                    <td class="font-bold text-sm md:text-lg ${c.text}">${res.team.name} ${index === 0 && res.hasData ? posTrophy : ''}</td>
                    <td class="text-center text-slate-600 font-medium text-sm md:text-lg">${res.hasData ? res.members : '-'}</td>
                    <td class="text-center">
                        <div class="flex flex-col items-center justify-center">
                            <span class="font-bold text-sm md:text-lg text-slate-700">${res.hasData ? res.points : '-'}</span>
                            ${res.hasData ? `<span class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">${res.maxPoints} MAX</span>` : ''}
                        </div>
                    </td>
                    <td class="text-right pr-4">
                        <span class="inline-block px-3 py-1 md:py-1.5 rounded-lg font-bold text-xs md:text-base tracking-wide ${res.hasData ? c.badge : 'bg-slate-50 text-slate-300 border border-slate-100'}">
                            ${res.hasData ? res.efficiency.toFixed(1) + '%' : '-'}
                        </span>
                    </td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        // Calcolo iniziale (campi vuoti)
        calculate();
    </script>
</body>
</html>
