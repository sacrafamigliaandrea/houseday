<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px 0 rgba(31, 38, 135, 0.05);
        }
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
        .header-banner {
            background-image: url('SfondoMACase.jpg');
            background-size: cover;
            background-position: center 25%;
            background-repeat: no-repeat;
            position: relative;
        }
        .header-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }
        .header-content {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body class="h-screen w-screen p-0 m-0 text-slate-800 flex flex-col">
    
    <header class="header-banner shrink-0 h-[15vh] min-h-[80px] md:min-h-[100px] flex items-center justify-center rounded-b-3xl shadow-md mb-2 md:mb-3">
        <div class="header-overlay rounded-b-3xl"></div>
        <div class="header-content text-center w-full px-4">
            <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight drop-shadow-lg leading-tight uppercase">House Day</h1>
        </div>
    </header>

    <div class="flex-grow flex flex-col lg:flex-row gap-2 md:gap-3 overflow-hidden h-full px-2 md:px-3 pb-2 md:pb-3">
        
        <!-- SEZIONE INPUT -->
        <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-2 md:gap-3 h-full" id="team-inputs">
            <!-- JS -->
        </div>

        <!-- SEZIONE CLASSIFICA -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden h-full border border-slate-200">
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white py-1.5 md:py-2 shrink-0">
                <h2 class="text-base md:text-lg font-bold text-center tracking-wide">Classifica - 14/10/2026</h2>
            </div>
            <div class="flex-grow flex flex-col p-1.5 md:p-2 h-full">
                <table class="w-full h-full text-left border-collapse">
                    <thead>
                        <tr class="text-[10px] md:text-xs uppercase tracking-widest text-slate-400 border-b border-slate-200 h-[10%]">
                            <th class="font-semibold text-center w-10">Pos</th>
                            <th class="font-semibold pl-2">Squadra</th>
                            <th class="font-semibold text-center">Membri</th>
                            <th class="font-semibold text-center">Punti</th>
                            <th class="font-semibold text-right pr-3">Efficienza</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-100">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>

    <script>
        const teams = [
            { id: 'aquilablu', name: 'AquilaBlu', color: 'blue' },
            { id: 'cerogiallo', name: 'CeroGiallo', color: 'yellow' },
            { id: 'tassorosso', name: 'TassoRosso', color: 'red' },
            { id: 'querciaverde', name: 'QuerciaVerde', color: 'green' }
        ];

        const colors = {
            blue: { bg: 'bg-blue-50/70', border: 'border-blue-200', text: 'text-blue-900', badge: 'bg-blue-100 text-blue-800' },
            yellow: { bg: 'bg-amber-50/70', border: 'border-amber-200', text: 'text-amber-900', badge: 'bg-amber-100 text-amber-800' },
            red: { bg: 'bg-rose-50/70', border: 'border-rose-200', text: 'text-rose-900', badge: 'bg-rose-100 text-rose-800' },
            green: { bg: 'bg-emerald-50/70', border: 'border-emerald-200', text: 'text-emerald-900', badge: 'bg-emerald-100 text-emerald-800' }
        };

        const state = {
            aquilablu: { members: 0, points: 0 },
            cerogiallo: { members: 0, points: 0 },
            tassorosso: { members: 0, points: 0 },
            querciaverde: { members: 0, points: 0 }
        };

        const inputsContainer = document.getElementById('team-inputs');
        const leaderboardBody = document.getElementById('leaderboard-body');

        teams.forEach(team => {
            const c = colors[team.color];
            const card = document.createElement('div');
            card.className = `glass-panel p-2 md:p-3 rounded-2xl border ${c.border} ${c.bg} flex flex-col justify-center h-full w-full shadow-sm gap-2`;
            card.innerHTML = `
                <h3 class="text-base md:text-xl font-bold ${c.text} text-center tracking-tight leading-none">${team.name}</h3>
                
                <div class="flex flex-col justify-center gap-2 md:gap-3 w-full mt-1">
                    <!-- Riga Membri -->
                    <div class="flex flex-row items-center justify-between bg-white/60 p-1.5 md:p-2 rounded-2xl border border-white/50 w-full shadow-sm">
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-slate-500 ml-2">Membri</span>
                        <div class="flex items-center gap-2">
                            <button class="no-select w-8 h-8 md:w-11 md:h-11 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 text-xl font-bold active:bg-slate-200 active:scale-95 flex items-center justify-center transition-transform" onclick="updateVal('${team.id}', 'members', -1)">-</button>
                            <span id="members-${team.id}-val" class="w-6 md:w-8 text-center font-bold text-lg md:text-2xl text-slate-800 no-select">0</span>
                            <button class="no-select w-8 h-8 md:w-11 md:h-11 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 text-xl font-bold active:bg-slate-200 active:scale-95 flex items-center justify-center transition-transform" onclick="updateVal('${team.id}', 'members', 1)">+</button>
                        </div>
                    </div>
                    
                    <!-- Riga Punti -->
                    <div class="flex flex-row items-center justify-between bg-white/60 p-1.5 md:p-2 rounded-2xl border border-white/50 w-full shadow-sm">
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-slate-500 ml-2">Punti</span>
                        <div class="flex items-center gap-2">
                            <button class="no-select w-8 h-8 md:w-11 md:h-11 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 text-xl font-bold active:bg-slate-200 active:scale-95 flex items-center justify-center transition-transform" onclick="updateVal('${team.id}', 'points', -1)">-</button>
                            <span id="points-${team.id}-val" class="w-6 md:w-8 text-center font-bold text-lg md:text-2xl text-slate-800 no-select">0</span>
                            <button class="no-select w-8 h-8 md:w-11 md:h-11 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 text-xl font-bold active:bg-slate-200 active:scale-95 flex items-center justify-center transition-transform" onclick="updateVal('${team.id}', 'points', 1)">+</button>
                        </div>
                    </div>
                </div>
            `;
            inputsContainer.appendChild(card);
        });

        function updateVal(teamId, type, delta) {
            let current = state[teamId][type];
            let newVal = current + delta;
            
            if (newVal < 0) newVal = 0;
            
            state[teamId][type] = newVal;
            
            document.getElementById(`${type}-${teamId}-val`).innerText = newVal;
            
            calculate();
        }

        function calculate() {
            let results = [];
            
            teams.forEach(team => {
                const members = state[team.id].members;
                const points = state[team.id].points;
                
                let efficiency = 0;
                let maxPoints = members * 2;

                if (members > 0) {
                    efficiency = (points / maxPoints) * 100;
                    if (efficiency > 100) efficiency = 100; 
                }

                results.push({
                    team: team,
                    members: members,
                    points: points,
                    maxPoints: maxPoints,
                    efficiency: efficiency,
                    hasData: (members > 0 || points > 0)
                });
            });

            results.sort((a, b) => b.efficiency - a.efficiency || b.points - a.points);

            leaderboardBody.innerHTML = '';
            
            results.forEach((res, index) => {
                if (index > 0) {
                    const prev = results[index - 1];
                    if (res.efficiency === prev.efficiency && res.points === prev.points) {
                        res.actualRank = prev.actualRank;
                        res.rankPts = prev.rankPts;
                    } else {
                        res.actualRank = index + 1;
                        res.rankPts = 4 - index;
                    }
                } else {
                    res.actualRank = 1;
                    res.rankPts = 4;
                }

                const c = colors[res.team.color];
                const tr = document.createElement('tr');
                
                tr.className = `transition-colors hover:bg-slate-50/80 h-[22.5%]`; 
                
                let posBadge = 'bg-slate-100 text-slate-400';
                let posTrophy = '';
                
                if (res.hasData) {
                    if (res.actualRank === 1) {
                        posBadge = 'bg-gradient-to-br from-yellow-300 to-yellow-500 text-yellow-900 shadow ring-1 ring-yellow-200 ring-offset-1';
                        posTrophy = '🏆';
                    } else if (res.actualRank === 2) {
                        posBadge = 'bg-gradient-to-br from-slate-200 to-slate-300 text-slate-700 shadow-sm';
                    } else if (res.actualRank === 3) {
                        posBadge = 'bg-gradient-to-br from-orange-200 to-orange-300 text-orange-800 shadow-sm';
                    } else {
                        posBadge = 'bg-white border border-slate-200 text-slate-500 shadow-sm';
                    }
                }

                tr.innerHTML = `
                    <td class="text-center">
                        <span class="inline-flex items-center justify-center w-7 h-7 md:w-8 md:h-8 rounded-full font-bold text-xs md:text-sm ${posBadge}">
                            ${res.hasData ? res.actualRank : '-'}
                        </span>
                    </td>
                    <td class="font-bold text-sm md:text-lg ${c.text} flex items-center h-full gap-2 pl-2">
                        <span>${res.team.name}</span> 
                        ${res.hasData ? `<span class="inline-flex items-center justify-center bg-slate-800 text-white text-[10px] md:text-xs font-bold px-2 md:px-2.5 py-0.5 md:py-1 rounded-full shadow-sm">+${res.rankPts}</span>` : ''}
                        ${res.actualRank === 1 && res.hasData ? `<span>${posTrophy}</span>` : ''}
                    </td>
                    <td class="text-center text-slate-600 font-medium text-sm md:text-xl">${res.hasData ? res.members : '-'}</td>
                    <td class="text-center">
                        <div class="flex flex-col items-center justify-center">
                            <span class="font-bold text-sm md:text-xl text-slate-700">${res.hasData ? res.points : '-'}</span>
                            ${res.hasData ? `<span class="text-[8px] md:text-[9px] uppercase tracking-wider text-slate-400 font-semibold leading-none">${res.maxPoints} MAX</span>` : ''}
                        </div>
                    </td>
                    <td class="text-right pr-3">
                        <span class="inline-block px-2 md:px-3 py-1 md:py-1.5 rounded-lg font-bold text-xs md:text-base tracking-wide ${res.hasData ? c.badge : 'bg-slate-50 text-slate-300 border border-slate-100'}">
                            ${res.hasData ? res.efficiency.toFixed(1) + '%' : '-'}
                        </span>
                    </td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        calculate();
    </script>
</body>
</html>
