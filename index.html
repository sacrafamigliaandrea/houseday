<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Libreria per esportazione immagine ad alta risoluzione -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
        }
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
        .banner-text-glow {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0, 0, 0, 0.9);
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- TOP BAR / BANNER COMPLETO -->
    <header class="shrink-0 w-full relative overflow-hidden rounded-b-3xl shadow-lg leading-none bg-transparent">
        <img 
            src="banner.jpg" 
            alt="Mascotte Case" 
            class="w-full h-auto block rounded-b-3xl"
        >
        <div class="absolute bottom-1 sm:bottom-3 inset-x-0 text-center px-2 pointer-events-none z-10">
            <h1 class="text-xl sm:text-3xl md:text-5xl font-black text-white uppercase tracking-wider banner-text-glow leading-tight">
                House Day
            </h1>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="flex-grow w-full max-w-7xl mx-auto p-3 sm:p-4 md:p-6 flex flex-col lg:flex-row gap-4 sm:gap-6">
        
        <!-- SEZIONE INPUT SQUADRE -->
        <section class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4" id="team-inputs" aria-label="Controllo Punti Squadre">
            <!-- Schede generate da JavaScript -->
        </section>

        <!-- SEZIONE CLASSIFICA DA ESPORTARE -->
        <div class="flex-1 flex flex-col gap-2">
            
            <!-- CARD CLASSIFICA EFFETTIVA -->
            <section id="leaderboard-card" class="glass-panel rounded-3xl overflow-hidden flex flex-col border border-slate-200/80 shadow-md min-h-[380px] bg-white">
                <!-- Barra del titolo con Classe modificabile -->
                <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white py-3 px-3 sm:px-4 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                        <span class="text-xs sm:text-sm font-semibold text-slate-300 uppercase tracking-wide">Classifica</span>
                        <!-- Input classe interattivo -->
                        <div class="inline-flex items-center bg-slate-700/80 border border-slate-600 rounded-lg px-2 py-0.5">
                            <span class="text-[10px] text-slate-400 font-bold uppercase mr-1">Classe:</span>
                            <input 
                                type="text" 
                                id="class-name-input" 
                                value="1A" 
                                placeholder="Es. 2B"
                                class="bg-transparent text-amber-300 font-extrabold text-xs sm:text-sm focus:outline-none w-16 sm:w-20 tracking-wide"
                                oninput="syncCardName(this.value)"
                            >
                        </div>
                    </div>
                    <span class="text-[11px] sm:text-xs text-slate-300 font-medium">14/10/2026</span>
                </div>
                
                <div class="p-3 sm:p-4 flex-grow overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[280px]">
                        <thead>
                            <tr class="text-[11px] sm:text-xs uppercase tracking-wider text-slate-400 border-b border-slate-200/80 pb-2">
                                <th class="font-bold text-center w-12 pb-2">Pos</th>
                                <th class="font-bold pl-3 pb-2">Squadra</th>
                                <th class="font-bold text-right pr-3 pb-2">Efficienza</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-100">
                            <!-- Righe generate da JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer visivo nella card per l'esportazione -->
                <div class="bg-slate-50 border-t border-slate-100 px-4 py-2 text-center text-[10px] text-slate-400 font-medium">
                    House Day • Scuola Sacra Famiglia
                </div>
            </section>

            <!-- PULSANTE ESPORTAZIONE / CONDIVISIONE IMMAGINE -->
            <button 
                id="btn-export"
                onclick="exportLeaderboardImage()"
                class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-all text-sm"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span>Salva Card Classifica (PNG)</span>
            </button>
        </div>
        
    </main>

    <script>
        const teams = [
            { id: 'aquilablu', name: 'AquilaBlu', color: 'blue' },
            { id: 'cerogiallo', name: 'CeroGiallo', color: 'yellow' },
            { id: 'tassorosso', name: 'TassoRosso', color: 'red' },
            { id: 'querciaverde', name: 'QuerciaVerde', color: 'green' }
        ];

        const colors = {
            blue: { bg: 'bg-blue-50/80', border: 'border-blue-200', text: 'text-blue-900', badge: 'bg-blue-100 text-blue-800' },
            yellow: { bg: 'bg-amber-50/80', border: 'border-yellow-300', text: 'text-yellow-600', badge: 'bg-yellow-100 text-yellow-800' },
            red: { bg: 'bg-rose-50/80', border: 'border-rose-200', text: 'text-rose-900', badge: 'bg-rose-100 text-rose-800' },
            green: { bg: 'bg-emerald-50/80', border: 'border-emerald-200', text: 'text-emerald-900', badge: 'bg-emerald-100 text-emerald-800' }
        };

        const state = {
            aquilablu: { members: 0, points: 0 },
            cerogiallo: { members: 0, points: 0 },
            tassorosso: { members: 0, points: 0 },
            querciaverde: { members: 0, points: 0 }
        };

        const inputsContainer = document.getElementById('team-inputs');
        const leaderboardBody = document.getElementById('leaderboard-body');

        teams.forEach(team => {
            const c = colors[team.color];
            const card = document.createElement('div');
            card.className = `glass-panel p-3.5 sm:p-4 rounded-2xl border ${c.border} ${c.bg} flex flex-col justify-between shadow-sm gap-3`;
            card.innerHTML = `
                <h3 class="text-lg sm:text-xl font-extrabold ${c.text} text-center tracking-tight leading-tight">${team.name}</h3>
                
                <div class="flex flex-col gap-2.5 w-full">
                    <!-- Riga Membri -->
                    <div class="flex items-center justify-between bg-white/80 px-3 py-2 rounded-xl border border-white/60 shadow-xs">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Membri</span>
                        <div class="flex items-center gap-1.5 sm:gap-2">
                            <button class="no-select w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-700 text-xl font-bold active:bg-slate-100 active:scale-95 flex items-center justify-center transition-all shrink-0" onclick="updateVal('${team.id}', 'members', -1)">-</button>
                            <input 
                                type="number" 
                                id="members-${team.id}-val" 
                                value="0" 
                                min="0" 
                                class="w-16 sm:w-20 text-center font-bold text-base sm:text-xl text-slate-800 bg-white/90 border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none rounded-lg py-1 transition-all"
                                oninput="onDirectInput('${team.id}', 'members', this.value)"
                                onfocus="this.select()"
                            >
                            <button class="no-select w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-700 text-xl font-bold active:bg-slate-100 active:scale-95 flex items-center justify-center transition-all shrink-0" onclick="updateVal('${team.id}', 'members', 1)">+</button>
                        </div>
                    </div>
                    
                    <!-- Riga Punti -->
                    <div class="flex items-center justify-between bg-white/80 px-3 py-2 rounded-xl border border-white/60 shadow-xs">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Punti</span>
                        <div class="flex items-center gap-1.5 sm:gap-2">
                            <button class="no-select w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-700 text-xl font-bold active:bg-slate-100 active:scale-95 flex items-center justify-center transition-all shrink-0" onclick="updateVal('${team.id}', 'points', -1)">-</button>
                            <input 
                                type="number" 
                                id="points-${team.id}-val" 
                                value="0" 
                                min="0" 
                                class="w-16 sm:w-20 text-center font-bold text-base sm:text-xl text-slate-800 bg-white/90 border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 focus:outline-none rounded-lg py-1 transition-all"
                                oninput="onDirectInput('${team.id}', 'points', this.value)"
                                onfocus="this.select()"
                            >
                            <button class="no-select w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-700 text-xl font-bold active:bg-slate-100 active:scale-95 flex items-center justify-center transition-all shrink-0" onclick="updateVal('${team.id}', 'points', 1)">+</button>
                        </div>
                    </div>
                </div>
            `;
            inputsContainer.appendChild(card);
        });

        function updateVal(teamId, type, delta) {
            let current = state[teamId][type];
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            state[teamId][type] = newVal;
            document.getElementById(`${type}-${teamId}-val`).value = newVal;
            calculate();
        }

        function onDirectInput(teamId, type, value) {
            let parsedVal = parseInt(value, 10);
            if (isNaN(parsedVal) || parsedVal < 0) parsedVal = 0;
            state[teamId][type] = parsedVal;
            calculate();
        }

        function calculate() {
            let results = [];
            
            teams.forEach(team => {
                const members = state[team.id].members;
                const points = state[team.id].points;
                
                let efficiency = 0;
                let maxPoints = members * 2;

                if (members > 0) {
                    efficiency = (points / maxPoints) * 100;
                }

                results.push({
                    team: team,
                    members: members,
                    points: points,
                    maxPoints: maxPoints,
                    efficiency: efficiency,
                    hasData: (members > 0 || points > 0)
                });
            });

            results.sort((a, b) => b.efficiency - a.efficiency || b.points - a.points);
            leaderboardBody.innerHTML = '';
            
            results.forEach((res, index) => {
                if (index > 0) {
                    const prev = results[index - 1];
                    if (res.efficiency === prev.efficiency && res.points === prev.points) {
                        res.actualRank = prev.actualRank;
                        res.rankPts = prev.rankPts;
                    } else {
                        res.actualRank = index + 1;
                        res.rankPts = 4 - index;
                    }
                } else {
                    res.actualRank = 1;
                    res.rankPts = 4;
                }

                const c = colors[res.team.color];
                const tr = document.createElement('tr');
                tr.className = `transition-colors hover:bg-slate-50/80`;
                
                let posBadge = 'bg-slate-100 text-slate-400';
                let posTrophy = '';
                
                if (res.hasData) {
                    if (res.actualRank === 1) {
                        posBadge = 'bg-gradient-to-br from-amber-300 to-yellow-500 text-yellow-950 font-black shadow-sm ring-1 ring-yellow-300';
                        posTrophy = '🏆';
                    } else if (res.actualRank === 2) {
                        posBadge = 'bg-gradient-to-br from-slate-200 to-slate-300 text-slate-700 shadow-xs';
                    } else if (res.actualRank === 3) {
                        posBadge = 'bg-gradient-to-br from-amber-100 to-orange-200 text-amber-900 shadow-xs';
                    } else {
                        posBadge = 'bg-white border border-slate-200 text-slate-500 shadow-xs';
                    }
                }

                tr.innerHTML = `
                    <td class="text-center py-3.5">
                        <span class="inline-flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full font-bold text-xs sm:text-sm ${posBadge}">
                            ${res.hasData ? res.actualRank : '-'}
                        </span>
                    </td>
                    <td class="font-extrabold text-sm sm:text-base ${c.text} pl-3 py-3.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span>${res.team.name}</span> 
                            ${res.hasData ? `<span class="inline-flex items-center justify-center bg-slate-800 text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full shadow-xs">+${res.rankPts}</span>` : ''}
                            ${res.actualRank === 1 && res.hasData ? `<span class="text-base">${posTrophy}</span>` : ''}
                        </div>
                    </td>
                    <td class="text-right pr-3 py-3.5">
                        <span class="inline-block px-2.5 sm:px-3 py-1 rounded-lg font-bold text-xs sm:text-sm tracking-wide ${res.hasData ? c.badge : 'bg-slate-100 text-slate-400'}">
                            ${res.hasData ? res.efficiency.toFixed(1) + '%' : '-'}
                        </span>
                    </td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        // Funzione per esportare la sola card della classifica come PNG
        async function exportLeaderboardImage() {
            const card = document.getElementById('leaderboard-card');
            const className = (document.getElementById('class-name-input').value.trim() || 'Generale').replace(/[^a-zA-Z0-9_-]/g, '_');
            const fileName = `Classifica_HouseDay_${className}_14-10-2026.png`;

            const btn = document.getElementById('btn-export');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<span>Generazione in corso...</span>`;
            btn.disabled = true;

            try {
                // Cattura la card a scala 2x per garantire nitidezza su retina display
                const canvas = await html2canvas(card, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true
                });

                // Tentativo di salvataggio diretto o condivisione nativa (mobile)
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        fallbackDownload(canvas, fileName);
                        return;
                    }

                    const file = new File([blob], fileName, { type: 'image/png' });

                    // Se siamo su smartphone con supporto Web Share (apre "Salva immagine" o AirDrop/WhatsApp)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Classifica House Day',
                                text: `Classifica House Day - Classe ${className}`
                            });
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                fallbackDownload(canvas, fileName);
                            }
                        }
                    } else {
                        // Download classico per browser desktop
                        fallbackDownload(canvas, fileName);
                    }
                }, 'image/png');

            } catch (error) {
                console.error("Errore esportazione immagine:", error);
                alert("Si è verificato un errore durante la creazione dell'immagine.");
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        function fallbackDownload(canvas, fileName) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        calculate();
    </script>
</body>
</html>
