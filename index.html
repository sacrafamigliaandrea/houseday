<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>House Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 18px 0 rgba(15, 23, 42, 0.05);
        }

        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }
        .banner-text-glow {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- TOP BAR SENZA BANDE NERE: w-full senza sfondi scuri residui e allineamento naturale dell'immagine -->
    <header class="shrink-0 w-full relative overflow-hidden rounded-b-2xl sm:rounded-b-3xl shadow-md p-0 m-0 bg-transparent leading-none">
        <img 
            src="banner.jpg" 
            alt="Mascotte Case" 
            class="w-full h-auto block rounded-b-2xl sm:rounded-b-3xl select-none"
        >
        <div class="absolute bottom-1 sm:bottom-3 inset-x-0 text-center px-2 pointer-events-none z-10">
            <h1 class="text-xl sm:text-3xl md:text-5xl font-black text-white uppercase tracking-wider banner-text-glow">
                House Day
            </h1>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="flex-grow w-full max-w-7xl mx-auto p-3 sm:p-4 md:p-6 flex flex-col lg:flex-row gap-4 sm:gap-6">
        }
    </style>
</head>
<body class="w-full min-h-screen text-slate-800 flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- HEADER: Più alto, senza ombreggiatura scura pesante -->
    <header class="header-banner shrink-0 h-[22vh] min-h-[120px] md:min-h-[150px] flex items-center justify-center rounded-b-3xl shadow-sm mb-3 md:mb-4 px-4 overflow-hidden border-b border-slate-200">
        <div class="relative z-10 text-center w-full max-w-4xl">
            <h1 class="header-title-text text-3xl sm:text-4xl md:text-5xl font-extrabold text-white tracking-wide uppercase">
                House Day
            </h1>
            <p class="text-white/95 text-xs sm:text-sm font-semibold tracking-wider mt-1 drop-shadow">
                Pannello Gestione Punti & Classifica
            </p>
        </div>
    </header>

    <!-- MAIN WRAPPER: Scrollabile liberamente su mobile, griglia compatta su desktop -->
    <main class="flex-grow flex flex-col lg:flex-row gap-3 md:gap-4 px-3 sm:px-4 pb-4 max-w-7xl mx-auto w-full">
        
        <!-- SEZIONE INPUT SQUADRE -->
        <section class="flex-1 w-full" aria-label="Inserimento dati squadre">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3 h-full" id="team-inputs">
                <!-- Generato via JavaScript -->
            </div>
        </section>

        <!-- SEZIONE CLASSIFICA -->
        <section class="flex-1 w-full flex flex-col glass-panel rounded-2xl overflow-hidden border border-slate-200 shadow-sm" aria-label="Classifica in tempo reale">
            <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white py-2.5 px-4 shrink-0 flex items-center justify-between">
                <h2 class="text-sm sm:text-base font-bold tracking-wide flex items-center gap-2">
                    <span>🏆</span> Classifica Generale
                </h2>
                <span class="text-[11px] sm:text-xs text-slate-300 bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700">14/10/2026</span>
            </div>
            
            <div class="flex-grow p-2 sm:p-3 overflow-x-auto custom-scrollbar flex flex-col justify-start">
                <table class="w-full min-w-[340px] border-collapse text-left">
                    <thead>
                        <tr class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-400 border-b border-slate-200 pb-2">
                            <th class="font-semibold text-center w-8 sm:w-10 py-2">Pos</th>
                            <th class="font-semibold pl-1.5 sm:pl-2 py-2">Squadra</th>
                            <th class="font-semibold text-center py-2">Membri</th>
                            <th class="font-semibold text-center py-2">Punti</th>
                            <th class="font-semibold text-right pr-2 sm:pr-3 py-2">Efficienza</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-100">
                        <!-- Popolato dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
        
    </main>

    <script>
        const teams = [
            { id: 'aquilablu', name: 'AquilaBlu', color: 'blue' },
            { id: 'cerogiallo', name: 'CeroGiallo', color: 'yellow' },
            { id: 'tassorosso', name: 'TassoRosso', color: 'red' },
            { id: 'querciaverde', name: 'QuerciaVerde', color: 'green' }
        ];

        const colors = {
            blue: { 
                bg: 'bg-blue-50/80', 
                border: 'border-blue-200', 
                text: 'text-blue-900', 
                badge: 'bg-blue-100 text-blue-800 border border-blue-200' 
            },
            yellow: { 
                bg: 'bg-amber-50/80', 
                border: 'border-amber-200', 
                text: 'text-amber-900', 
                badge: 'bg-amber-100 text-amber-800 border border-amber-200' 
            },
            red: { 
                bg: 'bg-rose-50/80', 
                border: 'border-rose-200', 
                text: 'text-rose-900', 
                badge: 'bg-rose-100 text-rose-800 border border-rose-200' 
            },
            green: { 
                bg: 'bg-emerald-50/80', 
                border: 'border-emerald-200', 
                text: 'text-emerald-900', 
                badge: 'bg-emerald-100 text-emerald-800 border border-emerald-200' 
            }
        };

        const state = {
            aquilablu: { members: 0, points: 0 },
            cerogiallo: { members: 0, points: 0 },
            tassorosso: { members: 0, points: 0 },
            querciaverde: { members: 0, points: 0 }
        };

        const inputsContainer = document.getElementById('team-inputs');
        const leaderboardBody = document.getElementById('leaderboard-body');

        // Generazione tessere squadre per mobile e desktop
        teams.forEach(team => {
            const c = colors[team.color];
            const card = document.createElement('div');
            card.className = `glass-panel p-2.5 sm:p-3 rounded-2xl border ${c.border} ${c.bg} flex flex-col justify-between shadow-sm gap-2`;
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <h3 class="text-sm sm:text-base font-bold ${c.text} tracking-tight">${team.name}</h3>
                    <span class="w-3 h-3 rounded-full ${team.color === 'blue' ? 'bg-blue-500' : team.color === 'yellow' ? 'bg-amber-400' : team.color === 'red' ? 'bg-rose-500' : 'bg-emerald-500'}"></span>
                </div>
                
                <div class="flex flex-col gap-2 w-full mt-0.5">
                    <!-- Riga Membri -->
                    <div class="flex flex-row items-center justify-between bg-white/80 px-2.5 py-1.5 rounded-xl border border-white/60 shadow-xs">
                        <span class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-500">Membri</span>
                        <div class="flex items-center gap-1.5 sm:gap-2">
                            <button type="button" aria-label="Rimuovi membro" class="no-select w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-slate-50 border border-slate-200 shadow-xs text-slate-700 text-lg font-bold hover:bg-slate-100 active:bg-slate-200 active:scale-95 flex items-center justify-center transition-all cursor-pointer" onclick="updateVal('${team.id}', 'members', -1)">−</button>
                            <span id="members-${team.id}-val" class="w-7 sm:w-8 text-center font-bold text-base sm:text-xl text-slate-800 no-select">0</span>
                            <button type="button" aria-label="Aggiungi membro" class="no-select w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-slate-50 border border-slate-200 shadow-xs text-slate-700 text-lg font-bold hover:bg-slate-100 active:bg-slate-200 active:scale-95 flex items-center justify-center transition-all cursor-pointer" onclick="updateVal('${team.id}', 'members', 1)">+</button>
                        </div>
                    </div>
                    
                    <!-- Riga Punti -->
                    <div class="flex flex-row items-center justify-between bg-white/80 px-2.5 py-1.5 rounded-xl border border-white/60 shadow-xs">
                        <span class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-500">Punti</span>
                        <div class="flex items-center gap-1.5 sm:gap-2">
                            <button type="button" aria-label="Riduci punti" class="no-select w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-slate-50 border border-slate-200 shadow-xs text-slate-700 text-lg font-bold hover:bg-slate-100 active:bg-slate-200 active:scale-95 flex items-center justify-center transition-all cursor-pointer" onclick="updateVal('${team.id}', 'points', -1)">−</button>
                            <span id="points-${team.id}-val" class="w-7 sm:w-8 text-center font-bold text-base sm:text-xl text-slate-800 no-select">0</span>
                            <button type="button" aria-label="Aumenta punti" class="no-select w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-slate-50 border border-slate-200 shadow-xs text-slate-700 text-lg font-bold hover:bg-slate-100 active:bg-slate-200 active:scale-95 flex items-center justify-center transition-all cursor-pointer" onclick="updateVal('${team.id}', 'points', 1)">+</button>
                        </div>
                    </div>
                </div>
            `;
            inputsContainer.appendChild(card);
        });

        function updateVal(teamId, type, delta) {
            let current = state[teamId][type];
            let newVal = current + delta;
            
            if (newVal < 0) newVal = 0;
            
            state[teamId][type] = newVal;
            
            const label = document.getElementById(`${type}-${teamId}-val`);
            if (label) label.innerText = newVal;
            
            calculate();
        }

        function calculate() {
            let results = [];
            
            teams.forEach(team => {
                const members = state[team.id].members;
                const points = state[team.id].points;
                
                let efficiency = 0;
                let maxPoints = members * 2;

                if (members > 0) {
                    efficiency = (points / maxPoints) * 100;
                    if (efficiency > 100) efficiency = 100; 
                }

                results.push({
                    team: team,
                    members: members,
                    points: points,
                    maxPoints: maxPoints,
                    efficiency: efficiency,
                    hasData: (members > 0 || points > 0)
                });
            });

            // Ordinamento per efficienza decrescente, poi per punti totali
            results.sort((a, b) => b.efficiency - a.efficiency || b.points - a.points);

            leaderboardBody.innerHTML = '';
            
            results.forEach((res, index) => {
                if (index > 0) {
                    const prev = results[index - 1];
                    if (res.efficiency === prev.efficiency && res.points === prev.points) {
                        res.actualRank = prev.actualRank;
                        res.rankPts = prev.rankPts;
                    } else {
                        res.actualRank = index + 1;
                        res.rankPts = 4 - index;
                    }
                } else {
                    res.actualRank = 1;
                    res.rankPts = 4;
                }

                const c = colors[res.team.color];
                const tr = document.createElement('tr');
                
                tr.className = `transition-colors hover:bg-slate-50/70 border-b border-slate-100 last:border-b-0`; 
                
                let posBadge = 'bg-slate-100 text-slate-400';
                let posTrophy = '';
                
                if (res.hasData) {
                    if (res.actualRank === 1) {
                        posBadge = 'bg-gradient-to-br from-amber-300 to-amber-500 text-amber-950 shadow-xs font-bold';
                        posTrophy = '👑';
                    } else if (res.actualRank === 2) {
                        posBadge = 'bg-slate-200 text-slate-700 shadow-xs';
                    } else if (res.actualRank === 3) {
                        posBadge = 'bg-orange-200 text-orange-900 shadow-xs';
                    } else {
                        posBadge = 'bg-white border border-slate-200 text-slate-600 shadow-xs';
                    }
                }

                tr.innerHTML = `
                    <td class="text-center py-2.5">
                        <span class="inline-flex items-center justify-center w-6 h-6 sm:w-7 sm:h-7 rounded-full font-bold text-xs ${posBadge}">
                            ${res.hasData ? res.actualRank : '-'}
                        </span>
                    </td>
                    <td class="font-bold text-xs sm:text-sm ${c.text} pl-1.5 sm:pl-2 py-2.5">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span>${res.team.name}</span>
                            ${res.hasData ? `<span class="inline-flex items-center bg-slate-800 text-white text-[10px] font-semibold px-1.5 py-0.2 rounded-full">+${res.rankPts}</span>` : ''}
                            ${res.actualRank === 1 && res.hasData ? `<span class="text-xs">${posTrophy}</span>` : ''}
                        </div>
                    </td>
                    <td class="text-center text-slate-600 font-semibold text-xs sm:text-sm py-2.5">${res.hasData ? res.members : '-'}</td>
                    <td class="text-center py-2.5">
                        <div class="flex flex-col items-center justify-center">
                            <span class="font-bold text-xs sm:text-sm text-slate-700">${res.hasData ? res.points : '-'}</span>
                            ${res.hasData ? `<span class="text-[8px] uppercase text-slate-400 font-medium">${res.maxPoints} max</span>` : ''}
                        </div>
                    </td>
                    <td class="text-right pr-2 sm:pr-3 py-2.5">
                        <span class="inline-block px-1.5 sm:px-2.5 py-0.5 sm:py-1 rounded-md font-bold text-xs sm:text-sm ${res.hasData ? c.badge : 'bg-slate-50 text-slate-300 border border-slate-100'}">
                            ${res.hasData ? res.efficiency.toFixed(1) + '%' : '-'}
                        </span>
                    </td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        // Calcolo iniziale
        calculate();
    </script>
</body>
</html>
